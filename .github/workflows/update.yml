name: Kalender aktualisieren

on:
  schedule:
    - cron: '17 4 1 * *'   # monatlich, am 1. früh morgens
  workflow_dispatch:        # manuell startbar
  push:
    paths:
      - 'gesehen.txt'       # sofort neu bauen, wenn die Gesehen-Liste geändert wird

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Spielpläne einlesen und Kalender bauen
        run: npm run build
      - name: Änderungen speichern
        if: always()
        run: |
          git config user.name "kalender-bot"
          git config user.email "kalender-bot@users.noreply.github.com"
          git add -A docs data PRUEFLISTE.md
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Kalender aktualisiert"
            git push
          fi
